name: Build APK + pack module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle 8.7 dipasang langsung, jadi tidak perlu gradlew / gradle-wrapper.jar di repo
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AzenithAI-Companion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AzenithAI-Companion-apk
          path: AzenithAI-Companion.apk

      # Kalau ada zip module di folder module/, APK otomatis dimasukkan ke dalamnya
      - name: Pack module + APK
        run: |
          MOD=$(ls module/*.zip 2>/dev/null | head -n1 || true)
          if [ -n "$MOD" ]; then
            mkdir -p out
            tools/pack-module.sh "$MOD" AzenithAI-Companion.apk "out/$(basename "${MOD%.zip}")-with-app.zip"
          else
            echo "module/*.zip tidak ada, lewati pack"
          fi

      - uses: actions/upload-artifact@v4
        if: hashFiles('out/*.zip') != ''
        with:
          name: module-with-app
          path: out/*.zip
